<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Scanline Filter / Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseScan {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.85; }
      100% { transform: translateY(280px); opacity: 0.1; }
    }
    @keyframes bboxPulse1 {
      0%, 100% { stroke: #38bdf8; stroke-dashoffset: 0; }
      50% { stroke: #22d3ee; stroke-dashoffset: 10; }
    }
    @keyframes bboxPulse2 {
      0%, 100% { stroke: #818cf8; stroke-dashoffset: 0; }
      50% { stroke: #c084fc; stroke-dashoffset: 8; }
    }
    @keyframes bboxPulse3 {
      0%, 100% { stroke: #34d399; stroke-dashoffset: 0; }
      50% { stroke: #10b981; stroke-dashoffset: 6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .scanner-line {
      animation: pulseScan 4.5s ease-in-out infinite;
    }
    .bbox-1 {
      animation: bboxPulse1 3s ease-in-out infinite;
    }
    .bbox-2 {
      animation: bboxPulse2 3.5s ease-in-out infinite;
    }
    .bbox-3 {
      animation: bboxPulse3 4s ease-in-out infinite;
    }
    .particle {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .radar-beam {
      transform-origin: 1080px 180px;
      animation: radarSpin 7s linear infinite;
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Cyber Matrix Background Grid -->
  <g opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />

    <line x1="150" y1="0" x2="150" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="300" y1="0" x2="300" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="450" y1="0" x2="450" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="750" y1="0" x2="750" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="900" y1="0" x2="900" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Left Dynamic Computer Vision Bounding Box System -->
  <g opacity="0.75">
    <!-- Detection Box 1: "Object: Target [0.98]" -->
    <rect class="bbox-1" x="50" y="55" width="130" height="90" rx="4" fill="#38bdf8" fill-opacity="0.05" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="8 4" />
    <path d="M 50 67 L 50 55 L 62 55 M 168 55 L 180 55 L 180 67 M 180 133 L 180 145 L 168 145 M 62 145 L 50 145 L 50 133" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <rect x="50" y="38" width="92" height="17" rx="3" fill="#38bdf8" />
    <text x="55" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#041226">person : 0.98</text>

    <!-- Detection Box 2: "Object: Vehicle [0.94]" -->
    <rect class="bbox-2" x="70" y="180" width="150" height="120" rx="4" fill="#818cf8" fill-opacity="0.05" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="6 3" />
    <path d="M 70 192 L 70 180 L 82 180 M 208 180 L 220 180 L 220 192 M 220 288 L 220 300 L 208 300 M 82 300 L 70 300 L 70 288" stroke="#818cf8" stroke-width="2.5" fill="none" />
    <rect x="70" y="163" width="98" height="17" rx="3" fill="#818cf8" />
    <text x="75" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#041226">vehicle : 0.94</text>
  </g>

  <!-- Right Dynamic Radar Target Tracker -->
  <g opacity="0.85">
    <!-- Radar concentric rings -->
    <circle cx="1080" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />
    <circle cx="1080" cy="180" r="75" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="1080" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />
    <circle cx="1080" cy="180" r="4" fill="#38bdf8" />

    <!-- Radar Crosshair -->
    <line x1="960" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
    <line x1="1080" y1="60" x2="1080" y2="300" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />

    <!-- Spinning Radar Sweep Beam -->
    <g class="radar-beam">
      <path d="M 1080 180 L 1185 140 A 110 110 0 0 1 1190 180 Z" fill="url(#titleGrad)" opacity="0.35" />
    </g>

    <!-- Detected Target Box 3 -->
    <rect class="bbox-3" x="1005" y="115" width="85" height="70" rx="3" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.8" />
    <rect x="1005" y="98" width="75" height="17" rx="3" fill="#34d399" />
    <text x="1010" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#022c22">sensor : 0.99</text>
  </g>

  <!-- Animated Laser Scanning Line -->
  <g class="scanner-line">
    <line x1="260" y1="40" x2="940" y2="40" stroke="#38bdf8" stroke-width="2" filter="url(#radarGlow)" opacity="0.7" />
    <rect x="260" y="38" width="680" height="10" fill="url(#cyberGrid)" opacity="0.5" />
  </g>

  <!-- Ambient Dynamic Floating Points -->
  <circle class="particle" cx="280" cy="90" r="3" fill="#38bdf8" />
  <circle class="particle" cx="920" cy="80" r="2.5" fill="#818cf8" style="animation-delay: 1.5s;" />
  <circle class="particle" cx="310" cy="270" r="2" fill="#c084fc" style="animation-delay: 2.5s;" />
  <circle class="particle" cx="890" cy="290" r="3" fill="#34d399" style="animation-delay: 3.5s;" />

  <!-- Center Foreground Title & Subtitle (Cleanly Highlighted & Foregrounded) -->
  <g>
    <!-- Dark Backplate Badge Pill for Tagline -->
    <rect x="425" y="48" width="350" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="443" cy="62" r="4.5" fill="#10b981" />
    <text x="456" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">COMPUTER VISION ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#glow)">Awesome Object Detection</text>
    <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">Awesome Object Detection</text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Index of Real-Time Vision Frameworks, SaaS Platforms &amp; Open-Source Models
    </text>

    <!-- Tech Pillars Badges / Pills -->
    <g transform="translate(325, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
      <text x="80" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc">⚡ Real-Time YOLO</text>

      <!-- Pill 2 -->
      <rect x="195" y="0" width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1" />
      <text x="275" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">🎯 DETR &amp; Transformers</text>

      <!-- Pill 3 -->
      <rect x="390" y="0" width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-width="1" />
      <text x="470" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">📦 Cloud &amp; Edge SaaS</text>
    </g>

    <!-- Status Metadata Bar -->
    <text x="600" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
      SaaS Pricing Benchmarks • Real-Time Star Tracking • Apache-2.0 / MIT / AGPL Directory
    </text>
  </g>
</svg>
